<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE Bot 後台登入</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout" style="max-width: 560px; margin: 40px auto;">
      <section class="card login-card">
        <h1>LINE Bot 後台登入</h1>
        <p>請輸入 ADMIN_TOKEN，按下登入後進入主控台。</p>
        <label>
          密碼
          <input id="adminToken" type="password" placeholder="ADMIN_TOKEN" />
        </label>
        <div class="row" style="margin-top: 1rem; gap: 0.75rem;">
          <button id="saveTokenBtn">登入</button>
          <button id="clearTokenBtn" class="ghost">清除</button>
        </div>
        <div class="hint" style="margin-top: 1rem;">
          密碼會儲存在本機瀏覽器，登入後會自動跳轉到主控台。
        </div>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script>
      const $ = (selector) => document.querySelector(selector);
      function setToast(message, isError = false) {
        const toast = $('#toast');
        toast.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#111827';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3200);
      }
      $('#saveTokenBtn').addEventListener('click', () => {
        const token = $('#adminToken').value.trim();
        if (!token) {
          setToast('請輸入 ADMIN_TOKEN', true);
          return;
        }
        localStorage.setItem('lineBotAdminToken', token);
        setToast('登入成功，正在前往主控台...');
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 600);
      });
      $('#clearTokenBtn').addEventListener('click', () => {
        localStorage.removeItem('lineBotAdminToken');
        $('#adminToken').value = '';
        setToast('已清除登入資訊');
      });
      if (localStorage.getItem('lineBotAdminToken')) {
        window.location.href = '/dashboard.html';
      }
    </script>
  </body>
</html>
